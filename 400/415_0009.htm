<img id="FABTTXImage" src="415_0009.png" width=480 height=336 usemap="#415_0009" border=0 alt="415.9 - U cijenu oglašavanja je uračunata grafička i lektorska obrada poruke. - Redakcija teleteksta zadržava pravo obrade teksta u skladu s programskim odrednicama BHT i zakonskim propisima, a po potrebi i uz saglasnost naručioca izmijeni dio teksta, ne mijenjajući bitni sadržaj poruke. - Kapacitet poruke je određen s tri retka od 40 slovnih mijesta. - Poslovne poruke mogu se oblikovati u 6 boja, upotrebom većih slova, kao i titrajućim isticanjem dijelova teksta. - Naručilac može sedmično mijenjati sadržaj i grafičku obradu poruke. - Minimalan zakup prostora za oglašavanje je 30 dana. - Naknada za oglašavanje plaća se po fakturi BHT, ispostavljenoj na osnovu narudžbe oglašivača.    ">
