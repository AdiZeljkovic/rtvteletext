<img id="FABTTXImage" src="119_0003.png" width=480 height=336 usemap="#119_0003" border=0 alt="119.3 BHRT još jednom ukazuje na pokušaje RTRS-a da se selektivnim predstavljanj- em sudskih postupaka i finansijskih odnosa između dva javna emitera obmane javnost i stvori slika da se sudski po- stupci vode isključivo na štetu RTRS-a. RTRS u javnosti ističe pravosnažnu presudu prema kojoj je BHRT dužan RTRS isplatiti ukupno više od 17,7 miliona KM. Prema objavljenim detaljima presu- de,u taj iznos ulaze dugovanja po osno- vu korištenja fiksnih radioveza, kamate obaveze po osnovu raspodjele prihoda od marketinga i sudski troškovi. Međutim, RTRS javnosti ne iznosi cijelu istinu, odnosno i pravosnažnu obavezu RTRS-a da BHRT-u isplati 7,8 miliona KM, uvećano za pripadajuće kamate,što ukupno iznosi gotovo 15,6 miliona KM.Dakle,RTRS sele- ktira informacije i javnosti predstav- lja da je dug BHRT-a prema RTRS-u puno veći od onog što BHRT potražuje u izvr- šnom postupku.    ">
