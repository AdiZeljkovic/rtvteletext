			<font color="#FFFFFF"><img id="FABTTXImage" src="154_0007.png" width=480 height=336  border=0 alt="154.7 Nekada nas iskuša u dobru, a nekada u nesreći; nekada nam daje izobilje, a nekada nas iskušava u oskudici; nekada nas obasipa blagodatima i ugodnim životom, a nekada ih uskraćuje — rekao je reisul-ulema. Na kraju hutbe, reisul-ulema je proučio dovu: Uzvišeni Allahu, Tebi dižemo ruke naše. Ti znaš šapat svakog srca. Pomozi nam da nađemo lijeka za ranjenu dušu i vječni mir kod Tebe. Blagoslovi Svojim blagoslovom ljude Srebrenice i porod njihov za sva vremena. Usadi u naša srca spomen na Srebrenicu i u našoj sadašnjosti i u budućnosti naših sinova i kćeri. Neka pravda zamijeni tugu, a nada očajanje. Tako Ti Tvoje veličine i milosti. Amin!    ">
